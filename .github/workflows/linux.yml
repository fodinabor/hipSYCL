name: Linux build and test

on: [push, pull_request]

jobs:
  test:
    name: clang ${{ matrix.clang_version }}, ${{ matrix.os }}, ${{ matrix.splitter_pipeline }}
    runs-on: ${{ matrix.os }}
    env:
      HIPSYCL_PIPELINE: ${{ matrix.splitter_pipeline }}
    strategy:
      matrix:
        clang_version: [12, 13, 14]
        rocm_version: ['4.0.1']
        os: [ubuntu-20.04]
        splitter_pipeline: ["cbs", "pocl", "cbs-manual-loops", "pocl-manual-loops",]
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'recursive'
      - name: install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{matrix.clang_version}}
          sudo apt install libclang-${{matrix.clang_version}}-dev clang-tools-${{matrix.clang_version}} libomp-${{matrix.clang_version}}-dev llvm-${{matrix.clang_version}}-dev
          sudo python -m pip install lit
          sudo ln -s /usr/bin/FileCheck-${{matrix.clang_version}} /usr/bin/FileCheck
      - name: install boost (from source)
        if: matrix.os == 'ubuntu-18.04'
        run: |
          wget -q https://boostorg.jfrog.io/artifactory/main/release/1.70.0/source/boost_1_70_0.zip
          unzip boost_1_70_0.zip
          cd boost_1_70_0
          ./bootstrap.sh --prefix=/usr
          sudo ./b2 link=static,shared install -j$(nproc) || true
          cd ..
      - name: install boost (from apt)
        if: matrix.os == 'ubuntu-20.04'
        run: |
          sudo apt install libboost-all-dev
      - name: setup build env
        run: |
          
          if [[ "${{matrix.clang_version}}" == "12" ]]; then
            export CC=clang-12
            export CXX=clang++-12
          elif [[ "${{matrix.clang_version}}" == "13" ]]; then
            export CC=clang-13
            export CXX=clang++-13
          fi
          if [[ "${{matrix.splitter_pipeline}}" == "cbs-manual-loops" || "${{matrix.splitter_pipeline}}" == "pocl-manual-loops" ]]; then
            export CXXFLAGS="$CXXFLAGS -DHIPSYCL_MANUALLY_CREATED_LOOPS"
            export OMP_CXX_FLAGS="-mllvm -simplify-pocl=true"
          fi
          if [[ "${{matrix.clang_version}}" == "12" && "${{matrix.splitter_pipeline}}" == "cbs" ]]; then
            export CXXFLAGS="$CXXFLAGS -DHIPSYCL_NO_PHIS_IN_SPLIT"
          fi
          if [[ "${{matrix.clang_version}}" != "11" ]]; then
          if [[ "${{matrix.splitter_pipeline}}" != "pocl" ]]; then
            export OMP_CXX_FLAGS="$CXXFLAGS $OMP_CXX_FLAGS -fexperimental-new-pass-manager -fpass-plugin=/home/runner/work/hipSYCL/hipSYCL/build/install/lib/libhipSYCL_clang.so"
          else
            export OMP_CXX_FLAGS="$CXXFLAGS $OMP_CXX_FLAGS -fno-experimental-new-pass-manager"
          fi
          fi
          echo "CC=${CC}" >> $GITHUB_ENV
          echo "CXX=${CXX}" >> $GITHUB_ENV
          echo "CXXFLAGS=${CXXFLAGS}" >> $GITHUB_ENV
          echo "OMP_CXX_FLAGS=${OMP_CXX_FLAGS}" >> $GITHUB_ENV
      - name: build hipSYCL
        run: |
          mkdir build && cd build
          echo ${CXXFLAGS}
          
          cmake -DCMAKE_CXX_COMPILER=/usr/bin/clang++-${{matrix.clang_version}} -DCMAKE_CXX_FLAGS="${CXXFLAGS}" -DOMP_CXX_FLAGS="$OMP_CXX_FLAGS -fopenmp" -DCLANG_EXECUTABLE_PATH=/usr/bin/clang++-${{matrix.clang_version}} -DLLVM_DIR=/usr/lib/llvm-${{matrix.clang_version}}/cmake -DCMAKE_INSTALL_PREFIX=`pwd`/install -DBUILD_CLANG_PLUGIN=ON ..
          make -j2 install
      - name: setup CPU tests with loop splitting
        run: |
          mkdir /home/runner/work/hipSYCL/hipSYCL/build/tests-cpu
          cd /home/runner/work/hipSYCL/hipSYCL/build/tests-cpu
          
          export CXXFLAGS="-DHIPSYCL_NO_FIBERS"
          
          cmake -DHIPSYCL_PLATFORM=cpu -DhipSYCL_DIR=/home/runner/work/hipSYCL/hipSYCL/build/install/lib/cmake/hipSYCL -DCMAKE_CXX_FLAGS="$CXXFLAGS" /home/runner/work/hipSYCL/hipSYCL/tests
      - name: build CPU tests with loop splitting
        run: |
          cd /home/runner/work/hipSYCL/hipSYCL/build/tests-cpu
          make -j2
      - name: run LIT tests on CPU
        run: |
          cd /home/runner/work/hipSYCL/hipSYCL/build/tests-cpu
          LD_LIBRARY_PATH=/home/runner/work/hipSYCL/hipSYCL/build/install/lib make check
      - name: run CPU tests
        continue-on-error: true
        run: |
          cd /home/runner/work/hipSYCL/hipSYCL/build/tests-cpu
          LD_LIBRARY_PATH=/home/runner/work/hipSYCL/hipSYCL/build/install/lib ./sycl_tests
